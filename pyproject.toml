[project]
name = "erp-atlas"
version = "0.1.0"
description = "Legacy intelligence for Pick/UniVerse ERPs: code graph, live drift, cited answers, migration tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "mcp>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.63.0",
    "cryptography>=42",
    "fastembed>=0.9.0",
    "numpy>=2.4.6",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["atlas/parse/_lintbasic.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]   # typer.Option in defaults is the Typer idiom

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["atlas/parse/_lintbasic.py"]

[[tool.mypy.overrides]]
module = "atlas.parse._lintbasic"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
